---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: emergency
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: request-service
  template:
    metadata:
      labels:
        app: request-service
    spec:
      containers:
      - name: app
        image: emergency-app:latest
        imagePullPolicy: IfNotPresent
        command: ["uvicorn", "app.request_service:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
        env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: reliefgrid-auth
              key: AUTH_SECRET
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq/
        - name: COORDINATOR_URL
          value: http://coordinator:8000
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: request-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: emergency
spec:
  selector:
    app: request-service
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: emergency
spec:
  replicas: 1
