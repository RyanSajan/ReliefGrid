apiVersion: v1
kind: Namespace
metadata:
  name: emergency
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: request-service-data
  namespace: emergency
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shard-0-primary-data
  namespace: emergency
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shard-0-replica-data
  namespace: emergency
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
