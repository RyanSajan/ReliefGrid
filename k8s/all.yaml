---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
  namespace: emergency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matcher
  template:
    metadata:
      labels:
        app: matcher
    spec:
      containers:
      - name: app
        image: emergency-app:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "app.matcher"]
        ports:
        - containerPort: 8000
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq/
        - name: COORDINATOR_URL
          value: http://coordinator:8000
