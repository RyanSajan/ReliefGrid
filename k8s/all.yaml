apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: emergency
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: emergency
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        readinessProbe:
          exec:
            command: [rabbitmq-diagnostics, -q, ping]
          timeoutSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        ports:
        - containerPort: 5672
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: emergency
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672

